[project]
name = "culturefit"
version = "0.1.0"
description = "CultureFit Decision Engine - concept-screening decision-support web app"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # FastAPI: HTTP layer (app/api)
    "fastapi==0.115.*",
    # Pydantic v2: all input/output contracts
    "pydantic==2.9.*",
    # httpx: async HTTP client for the Qloo adapter and the LLM provider
    "httpx==0.27.*",
    # SQLAlchemy: persistence (decision_runs, evidence_records, workflow_events, ...)
    "sqlalchemy==2.0.*",
]

[project.optional-dependencies]
dev = [
    # pytest: offline test suite; live Qloo calls marked and skipped by default
    "pytest==8.3.*",
    # uvicorn: run the API locally (AGENTS.md section 7)
    "uvicorn[standard]==0.32.*",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # manual only, needs QLOO_API_KEY in the environment
    "live: live Qloo tests; skipped by default, run with pytest -m live",
]
addopts = "-m 'not live'"
