[project]
name = "consentiens-culturae"
version = "0.1.0"
description = "Consentiens-Culturae Decision Engine - concept-screening decision-support web app"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # FastAPI: HTTP layer (app/api)
    "fastapi==0.115.*",
    # Pydantic v2: all input/output contracts (2.12 for cp314 wheels; 3.14 is
    # the only Python on this machine)
    "pydantic==2.12.*",
    # httpx: async HTTP client for the Qloo adapter and the LLM provider
    "httpx==0.27.*",
    # SQLAlchemy: persistence (decision_runs, evidence_records, workflow_events, ...)
    "sqlalchemy==2.0.*",
    # psycopg: Postgres driver for SQLAlchemy (hosted Postgres: Neon, decision
    # log 2026-10-15). SQLite stays the local default via DATABASE_URL.
    "psycopg[binary]==3.2.*",
    # uvicorn[standard]: the API server, needed in prod (Render) not just dev
    "uvicorn[standard]==0.32.*",
]

[project.optional-dependencies]
dev = [
    # pytest: offline test suite; live Qloo calls marked and skipped by default
    "pytest==8.3.*",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # manual only, needs QLOO_API_KEY in the environment
    "live: live Qloo tests; skipped by default, run with pytest -m live",
]
addopts = "-m 'not live'"
